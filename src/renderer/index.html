<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data: blob: https: http:; media-src 'self' file: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;"
    />
    <title>Eisballis Markdown Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="tb-group">
          <button id="btn-open" class="tb-btn" type="button" title="Öffnen (Strg+O)">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3.2l1.6 2h6.2A1.5 1.5 0 0 1 16.5 7.5v6A1.5 1.5 0 0 1 15 15H4a1.5 1.5 0 0 1-1.5-1.5z" />
            </svg>
            <span>Öffnen</span>
          </button>
          <button id="btn-save" class="tb-btn" type="button" title="Speichern (Strg+S)">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4.5 3h8L16 6.5v10a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-13A.5.5 0 0 1 4.5 3Z" />
              <path d="M6.5 3.5v4h6v-4M6.5 11.5h7" />
            </svg>
            <span>Speichern</span>
          </button>
        </div>

        <span class="tb-sep"></span>

        <div class="tb-group segmented" id="mode-group" role="group" aria-label="Anzeigemodus">
          <button class="tb-btn" type="button" data-mode="view" title="Nur Ansicht (Strg+1)">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z" />
              <circle cx="10" cy="10" r="2.2" />
            </svg>
            <span>Ansicht</span>
          </button>
          <button class="tb-btn" type="button" data-mode="edit" title="Nur bearbeiten (Strg+2)">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M13.2 3.6l3.2 3.2L7 16.2l-4 1 1-4z" />
              <path d="M11.6 5.2l3.2 3.2" />
            </svg>
            <span>Bearbeiten</span>
          </button>
          <button class="tb-btn" type="button" data-mode="split" title="Geteilt: Editor links, Vorschau rechts (Strg+3)">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="2.5" y="4" width="15" height="12" rx="1.5" />
              <path d="M10 4v12" />
            </svg>
            <span>Geteilt</span>
          </button>
        </div>

        <span class="tb-sep"></span>

        <div class="tb-group">
          <button id="btn-font-dec" class="tb-btn compact" type="button" title="Text kleiner (Strg+-)">A−</button>
          <span id="font-size-label" class="tb-value" title="Aktuelle Textgröße">17</span>
          <button id="btn-font-inc" class="tb-btn compact" type="button" title="Text größer (Strg++)">A+</button>
        </div>

        <span class="tb-sep"></span>

        <div class="tb-group">
          <button id="btn-theme" class="tb-btn compact" type="button" title="Hell / Dunkel (Strg+D)">
            <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M15.5 12.6A6.2 6.2 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1Z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="3.4" />
              <path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M15.8 4.2l-1.5 1.5M5.7 14.3l-1.5 1.5" />
            </svg>
          </button>
          <button id="btn-reset-width" class="tb-btn compact" type="button" title="Textbreite zurücksetzen">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M2.5 5.5v9M17.5 5.5v9M6.5 10h7M8.2 8.2 6.5 10l1.7 1.8M11.8 8.2 13.5 10l-1.7 1.8" />
            </svg>
          </button>
        </div>

        <div class="tb-spacer"></div>

        <button id="btn-update" class="tb-btn ghost" type="button" title="Nach Updates suchen">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M16 10a6 6 0 1 1-1.9-4.4" />
            <path d="M16.4 3.2v3.6h-3.6" />
          </svg>
          <span>Nach Updates suchen</span>
          <span id="update-badge" class="badge" hidden>1</span>
        </button>
        <button id="btn-about" class="tb-btn compact" type="button" title="Über &amp; Tastenkürzel">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7.2" />
            <path d="M10 8.8v5" />
            <circle cx="10" cy="6.3" r=".9" />
          </svg>
        </button>
      </header>

      <main id="workspace">
        <div id="editor-pane" hidden>
          <textarea id="editor" spellcheck="false" placeholder="# Deine Überschrift &#10;&#10;Schreibe hier Markdown …"></textarea>
        </div>

        <div id="splitter" hidden title="Ziehen zum Anpassen"></div>

        <div id="preview-pane">
          <div id="preview-scroll">
            <article id="preview" class="markdown"></article>
          </div>
          <div id="width-handle" hidden title="Ziehen: Textbreite · Doppelklick: zurücksetzen"></div>
          <div id="empty-state">
            <div class="empty-inner">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3.5h9l5 5v12H5z" />
                <path d="M14 3.5v5h5M8 13h8M8 16.5h5" />
              </svg>
              <h1>Keine Datei geöffnet</h1>
              <p><kbd>Strg</kbd> + <kbd>O</kbd> zum Öffnen — oder eine <code>.md</code>-Datei hierher ziehen.</p>
            </div>
          </div>
        </div>
      </main>

      <footer id="statusbar">
        <span id="status-file" title="">Keine Datei geöffnet</span>
        <span id="status-meta"></span>
        <span class="status-spacer"></span>
        <span id="status-update" hidden></span>
        <span id="status-zoom" title="Zoom – mit Strg + Mausrad ändern">100 %</span>
        <span id="status-version"></span>
      </footer>

      <div id="drop-overlay" hidden>
        <div class="drop-box">Datei hier ablegen zum Öffnen</div>
      </div>
    </div>

    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
