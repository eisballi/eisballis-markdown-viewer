name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Electron libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libgbm1 libgtk-3-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2
      - run: xvfb-run --auto-servernum npm test
        env:
          CI: "true"

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:win

      - name: Prepare stable file names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stable | Out-Null
          Copy-Item release/Eisballis-Markdown-Viewer-Setup-*.exe stable/Eisballis-Markdown-Viewer-Setup.exe
          Copy-Item release/Eisballis-Markdown-Viewer-*-portable.exe stable/Eisballis-Markdown-Viewer-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            stable/*.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:linux

      - name: Prepare stable file names
        run: |
          mkdir -p stable
          cp release/*.AppImage stable/Eisballis-Markdown-Viewer-x86_64.AppImage
          cp release/*.deb stable/Eisballis-Markdown-Viewer-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            stable/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check that the builds produced files
        run: |
          ls -R artifacts
          count=$(find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) | wc -l)
          echo "found $count installer(s)"
          test "$count" -ge 8

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          generate_release_notes: true
